# XcodeGen input: `xcodegen generate` turns this into Retold.xcodeproj on the build Mac.
# The generated project and Info.plist are not committed. CFBundleVersion is stamped by build.sh.
name: Retold
options:
  bundleIdPrefix: dev.retold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO

targets:
  Retold:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Retold
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Retold
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.retold.app
        PRODUCT_NAME: Retold
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Retold/Engine/Retold-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/build/lib"
        OTHER_LDFLAGS: "-lretold_ffi"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
